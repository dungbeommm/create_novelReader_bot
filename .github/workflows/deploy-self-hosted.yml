name: Deploy persistent bot on your own server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novel-deploy-server
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, novel-bot]
    timeout-minutes: 30
    environment: bot-production
    env:
      # Provision this absolute, stable path on your server before the first run.
      DEPLOY_DIR: ${{ vars.NOVEL_DEPLOY_DIR }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          dest = Path(os.environ.get('DEPLOY_DIR', ''))
          if not dest.is_absolute() or str(dest) == '/': raise SystemExit('Set NOVEL_DEPLOY_DIR to a dedicated absolute directory.')
          for name in ('TELEGRAM_BOT_TOKEN','ALLOWED_USER_IDS','GH_RELEASE_TOKEN'):
              if not os.environ.get(name): raise SystemExit('Missing secret: ' + name)
          PY
      - name: Copy code, preserving state and configuration
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --exclude='.git/' --exclude='.env' --exclude='data/' --exclude='output_text/' --exclude='output_audio/' --exclude='__pycache__/' --exclude='.venv/' --exclude='.pytest_cache/' --exclude='models/translation/' ./ "$DEPLOY_DIR/"
      - name: Write private configuration (never print secrets)
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          keys = ('TELEGRAM_BOT_TOKEN','ALLOWED_USER_IDS','GH_RELEASE_TOKEN','GDRIVE_CLIENT_ID','GDRIVE_CLIENT_SECRET','GDRIVE_REFRESH_TOKEN','GDRIVE_FOLDER_ID','GITHUB_REPOSITORY')
          values = {k: os.environ.get(k, '') for k in keys}
          if any('\n' in v or '\r' in v or "'" in v for v in values.values()): raise SystemExit('Invalid config value')
          dest = Path(os.environ['DEPLOY_DIR'])/'.env'
          temp = dest.with_suffix('.tmp')
          fd = os.open(temp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w') as f:
              for k,v in values.items(): f.write(f"{k}='{v}'\n")
          temp.replace(dest)
          PY
      - name: Start persistent Docker services
        run: |
          cd "$DEPLOY_DIR"
          test -s models/voices/ngochuyennew.onnx
          docker compose -f compose.yaml -f compose.github.yaml up --build -d --wait tts bot
          docker compose -f compose.yaml -f compose.github.yaml ps
